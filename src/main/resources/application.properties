spring.application.name=finpay-api

finpay.jwt.issuer=https://finpay.local
finpay.jwt.access-token-ttl=PT15M
finpay.jwt.refresh-token-ttl=PT168H
finpay.jwt.secret=${FINPAY_JWT_SECRET:}

spring.data.redis.host=${FINPAY_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${FINPAY_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

finpay.kafka.enabled=${FINPAY_KAFKA_ENABLED:false}
finpay.kafka.payment-events-topic=finpay.payment-events.v1
finpay.kafka.publisher-enabled=false
spring.kafka.bootstrap-servers=${FINPAY_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9094}
spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=false

finpay.webhook.encryption-key=${FINPAY_WEBHOOK_ENCRYPTION_KEY:${FINPAY_JWT_SECRET:}}
finpay.webhook.require-https=${FINPAY_WEBHOOK_REQUIRE_HTTPS:false}
finpay.webhook.allow-private-addresses=${FINPAY_WEBHOOK_ALLOW_PRIVATE_ADDRESSES:true}
finpay.webhook.scheduler-enabled=true
finpay.webhook.scheduler-initial-delay-ms=5000
finpay.webhook.scheduler-delay-ms=5000

spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=finpay_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${FINPAY_DB_USERNAME}
spring.datasource.password=${FINPAY_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
