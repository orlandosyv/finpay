services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${FINPAY_DB_PASSWORD:?Set FINPAY_DB_PASSWORD in a .env file}
    ports:
      - "${FINPAY_DB_PORT:-1434}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${FINPAY_DB_PASSWORD:?Set FINPAY_DB_PASSWORD in a .env file}
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -Q "IF DB_ID(N'finpay_db') IS NULL CREATE DATABASE finpay_db"
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "${FINPAY_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      FINPAY_DB_USERNAME: sa
      FINPAY_DB_PASSWORD: ${FINPAY_DB_PASSWORD:?Set FINPAY_DB_PASSWORD in a .env file}
      FINPAY_JWT_SECRET: ${FINPAY_JWT_SECRET:?Set FINPAY_JWT_SECRET in a .env file}
      FINPAY_WEBHOOK_ENCRYPTION_KEY: ${FINPAY_WEBHOOK_ENCRYPTION_KEY:-${FINPAY_JWT_SECRET}}
      FINPAY_WEBHOOK_REQUIRE_HTTPS: ${FINPAY_WEBHOOK_REQUIRE_HTTPS:-false}
      FINPAY_WEBHOOK_ALLOW_PRIVATE_ADDRESSES: ${FINPAY_WEBHOOK_ALLOW_PRIVATE_ADDRESSES:-true}
      FINPAY_REDIS_HOST: redis
      FINPAY_REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=finpay_db;encrypt=true;trustServerCertificate=true
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "${FINPAY_API_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FINPAY_FRONTEND_PORT:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
